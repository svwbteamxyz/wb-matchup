<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Team XYZ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Shadowverse: Worlds Beyond のチーム XYZ 公式サイト。ニュース、所属プレイヤー、大会実績、チーム概要。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: esports team official site — white header bar with logo + English nav, full-width black main visual, then ABOUT / NEWS / PLAYERS / PERFORMANCE sections with big English headings and Japanese sub-labels, black footer. Deliberately single (light) look. */
:root{
  color-scheme:light;
  --bg:#FFFFFF;--ink:#111014;--muted:#6C6A78;--line:#E3E2EA;--soft:#F4F3F8;
  --black:#0D0C14;--black-ink:#F4F3FA;--black-muted:#9A97B0;--black-line:#26243A;
  --accent:#4B3AC6;--accent-soft:#ECE9FC;--accent-ink:#FFFFFF;
  --gold:#B07A06;--silver:#7A8494;--bronze:#9C5A33;--top:#4B3AC6;
  --warn:#B4332F;--ok:#1E7A4C;--surface:#FFFFFF;
  --f-en:"Anton","Oswald","Zen Kaku Gothic New",Impact,sans-serif;
  --f-sub:"Oswald","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --hdr:64px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--hdr) + 12px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.en{font-family:var(--f-sub);letter-spacing:.08em;text-transform:uppercase}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr .wrap{height:var(--hdr);display:flex;align-items:center;gap:24px}
.logo{font-family:var(--f-en);font-size:30px;letter-spacing:.06em;text-decoration:none;line-height:1;display:flex;align-items:baseline;gap:8px}
.logo small{font-family:var(--f-sub);font-size:11px;letter-spacing:.2em;color:var(--muted)}
.nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav a{font-family:var(--f-sub);font-weight:600;font-size:14px;letter-spacing:.12em;text-decoration:none;padding:8px 12px;position:relative}
.nav a::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .2s}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.nav .xi{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);margin-left:8px;padding:0}
.nav .xi::after{display:none}
.xi svg{width:15px;height:15px;fill:currentColor}
.burger{display:none;margin-left:auto;background:none;border:0;width:44px;height:44px;cursor:pointer;position:relative}
.burger span,.burger span::before,.burger span::after{position:absolute;left:11px;width:22px;height:2px;background:var(--ink);content:"";transition:transform .2s,top .2s}
.burger span{top:21px}.burger span::before{left:0;top:-7px}.burger span::after{left:0;top:7px}
.menu-open .burger span{background:transparent}.menu-open .burger span::before{top:0;transform:rotate(45deg)}.menu-open .burger span::after{top:0;transform:rotate(-45deg)}
@media (max-width:760px){
  .burger{display:block}
  .nav{position:fixed;inset:calc(var(--hdr) + env(safe-area-inset-top,0px)) 0 auto 0;flex-direction:column;align-items:stretch;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:8px max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px));transform:translateY(-8px);opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility .2s}
  .menu-open .nav{opacity:1;transform:none;visibility:visible}
  .nav a{font-size:20px;padding:14px 0;border-bottom:1px solid var(--line)}
  .nav a::after{display:none}
  .nav .xi{margin:16px 0 0;width:auto;height:auto;border-radius:999px;padding:10px 16px;font-size:14px;display:inline-flex;gap:8px;align-self:flex-start}
}

/* main visual */
.mv{background:var(--black);color:var(--black-ink);position:relative;overflow:hidden}
.mv .wrap{padding-block:72px 64px;position:relative;z-index:1;display:grid;gap:28px}
.mv-img{position:absolute;inset:0;background-size:cover;background-position:center}
.mv-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(13,12,20,.88) 0%,rgba(13,12,20,.55) 55%,rgba(13,12,20,.25) 100%)}
.mv-bg{position:absolute;right:-2vw;bottom:-4vw;font-family:var(--f-en);font-size:clamp(180px,34vw,460px);line-height:.8;color:transparent;-webkit-text-stroke:1px var(--black-line);letter-spacing:.02em;user-select:none;pointer-events:none}
.mv-k{font-family:var(--f-sub);font-size:13px;letter-spacing:.32em;color:var(--black-muted)}
.mv h1{font-family:var(--f-en);font-weight:400;font-size:clamp(56px,10vw,120px);line-height:.95;letter-spacing:.02em}
.mv h1 b{font-weight:400;color:transparent;-webkit-text-stroke:2px var(--black-ink)}
.mv-tag{font-size:clamp(16px,2.2vw,20px);font-weight:700;margin:0;max-width:32em}
.mv-intro{color:var(--black-muted);margin:6px 0 0;max-width:40em;white-space:pre-wrap}
.stats{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--black-line);margin-top:8px}
.stats div{padding:16px 28px 0 0;margin-right:28px;display:flex;flex-direction:column}
.stats div+div{padding-left:28px;border-left:1px solid var(--black-line)}
.stats b{font-family:var(--f-en);font-weight:400;font-size:clamp(34px,5vw,48px);line-height:1}
.stats span{font-family:var(--f-sub);font-size:11px;letter-spacing:.16em;color:var(--black-muted)}
.stats .g b{color:#E3B341}
@media (max-width:560px){.stats div{padding-right:16px;margin-right:16px}.stats div+div{padding-left:16px}.mv .wrap{padding-block:52px 44px}}

/* sections */
section.sec{padding-block:88px 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:32px;flex-wrap:wrap}
.sec-h h2{display:flex;flex-direction:column;gap:6px}
.sec-h h2 .big{font-family:var(--f-en);font-weight:400;font-size:clamp(44px,7vw,72px);line-height:.9;letter-spacing:.03em}
.sec-h h2 .ja{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.1em}
.btn-more{display:inline-flex;align-items:center;gap:12px;background:none;border:1px solid var(--ink);border-radius:999px;padding:10px 22px;font-family:var(--f-sub);font-weight:600;letter-spacing:.14em;font-size:13px;cursor:pointer;text-decoration:none;transition:background .15s,color .15s}
.btn-more::after{content:"→"}
.btn-more:hover{background:var(--ink);color:var(--bg)}
.center{display:flex;justify-content:center;margin-top:28px}
.empty{border:1px dashed var(--line);padding:32px;text-align:center;color:var(--muted)}

/* news */
.news{border-top:1px solid var(--ink)}
.news details{border-bottom:1px solid var(--line)}
.news summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:112px auto minmax(0,1fr) 24px;gap:16px;align-items:baseline;padding:20px 4px}
.news summary::-webkit-details-marker{display:none}
.news summary::after{content:"+";font-family:var(--f-sub);color:var(--muted);text-align:right}
.news details[open] summary::after{content:"−"}
.news details.nobody summary{cursor:default}.news details.nobody summary::after{content:""}
.news .d{font-family:var(--f-sub);letter-spacing:.06em;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.news .cat{font-family:var(--f-sub);font-size:11px;letter-spacing:.14em;border:1px solid var(--ink);padding:1px 8px;white-space:nowrap}
.news .t{font-weight:700;overflow-wrap:anywhere}
.news .body{padding:0 4px 22px calc(112px + 16px + 4px);white-space:pre-wrap;color:var(--ink);max-width:calc(65ch + 140px)}
.news summary:hover .t{color:var(--accent)}
@media (max-width:640px){.news summary{grid-template-columns:auto minmax(0,1fr) 20px;gap:4px 12px}.news .d{grid-column:1}.news .cat{grid-column:2;justify-self:start}.news summary::after{grid-column:3;grid-row:1}.news .t{grid-column:1/-1}.news .body{padding-left:4px}}

/* players */
.players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 20px}
@media (max-width:900px){.players{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:600px){.players{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 14px}}
.pl{background:none;border:0;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0}
.ph{aspect-ratio:1/1;max-width:100%;width:100%;background:var(--soft);position:relative;overflow:hidden;display:grid;place-items:center}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.pl:hover .ph img{transform:scale(1.04)}
.ph .ini{font-family:var(--f-en);font-size:clamp(48px,8vw,84px);color:var(--line)}
.ph .rl{position:absolute;left:0;top:0;background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;letter-spacing:.08em;padding:3px 10px}
.pl-n{display:flex;flex-direction:column;min-width:0}
.pl-n b{font-size:17px;line-height:1.35;overflow-wrap:anywhere}
.pl-n span{font-family:var(--f-sub);font-size:12px;letter-spacing:.06em;color:var(--muted);overflow-wrap:anywhere}
.pl:hover .pl-n b{color:var(--accent)}
.crl{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.pl-n .crl .cls{color:#fff;font-family:var(--f-body);letter-spacing:.04em;font-size:11px}.pl-n .crl .cls-bishop,.pl-n .crl .cls-royal{color:#1B1A22}.pl-n .crl .crk{font-size:10px}
.crl .crk{font-family:var(--f-sub);font-size:10px;letter-spacing:.14em;color:var(--muted)}
.crl b{font-family:var(--f-en);font-weight:400;font-size:18px;line-height:1;letter-spacing:.02em}
.crl.big{gap:10px;margin:2px 0}.crl.big .crk{font-size:12px}.crl.big b{font-size:30px}.crl.big .cls{font-size:12px;padding:5px 9px}
.m-champion{--c:var(--gold)}.m-runner{--c:var(--silver)}.m-third{--c:var(--bronze)}.m-top{--c:var(--top)}.m-other{--c:var(--muted)}

/* performance */
.yr{font-family:var(--f-en);font-weight:400;font-size:28px;letter-spacing:.04em;margin:28px 0 8px;display:flex;align-items:center;gap:14px}
.yr::after{content:"";flex:1;height:1px;background:var(--line)}
.yr:first-child{margin-top:0}
.perf{border-top:1px solid var(--ink)}
.prow{display:grid;grid-template-columns:96px 104px minmax(0,1fr) minmax(0,200px);gap:16px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line)}
.prow .d{font-family:var(--f-sub);color:var(--muted);font-size:14px;letter-spacing:.04em}
.res{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;white-space:nowrap}
.res i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cls{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;line-height:1;padding:4px 8px;border-radius:3px;background:var(--cc);color:#fff}
.cls-bishop,.cls-royal{color:#1B1A22}
.prow .t{font-weight:700;overflow-wrap:anywhere}
.prow .t small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.prow .p{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px}
.prow .p .av{width:28px;height:28px;font-size:12px}
@media (max-width:640px){.prow{grid-template-columns:auto minmax(0,1fr);gap:2px 12px}.prow .d{grid-column:1/-1}.prow .res{grid-row:2}.prow .t{grid-row:2}.prow .p{grid-column:1/-1;margin-top:4px}}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;background:var(--soft);color:var(--muted);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}

/* about (team overview): number + heading on the left, bullet list on the right */
.about{border-top:1px solid var(--ink)}
.ab{display:grid;grid-template-columns:120px 240px minmax(0,1fr);gap:24px;padding:36px 4px;border-bottom:1px solid var(--line);align-items:start}
.ab-no{font-family:var(--f-en);font-weight:400;font-size:64px;line-height:.9;letter-spacing:.02em}
.ab-t{font-size:22px;font-weight:700;line-height:1.4;padding-top:6px;display:flex;flex-direction:column;gap:12px}
.ab-t::after{content:"";width:28px;height:3px;background:var(--accent)}
.ab ul{list-style:none;margin:0;padding:6px 0 0;display:flex;flex-direction:column;gap:10px}
.ab li{position:relative;padding-left:20px;line-height:1.7}
.ab li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.ab p{margin:6px 0 0;white-space:pre-wrap}
@media (max-width:800px){.ab{grid-template-columns:72px minmax(0,1fr);gap:8px 16px;padding:28px 4px}.ab-no{font-size:48px}.ab-t{font-size:19px;padding-top:2px}.ab ul,.ab p{grid-column:1/-1;padding-top:10px}}

/* follow + footer */
.follow{margin-top:104px;background:var(--soft)}
.follow .wrap{padding-block:48px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.follow h3{font-family:var(--f-en);font-weight:400;font-size:clamp(32px,5vw,48px);letter-spacing:.03em;line-height:1}
.follow p{margin:6px 0 0;color:var(--muted);font-size:14px}
.xbig{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);text-decoration:none;border-radius:999px;padding:14px 26px;font-weight:700}
.xbig svg{width:17px;height:17px;fill:currentColor}
footer{background:var(--black);color:var(--black-muted)}
footer .wrap{padding-block:48px 36px;display:flex;flex-direction:column;gap:28px}
.f-top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.f-top .logo{color:var(--black-ink);font-size:36px}
.f-nav{display:flex;flex-wrap:wrap;gap:6px 24px}
.f-nav a{font-family:var(--f-sub);font-size:13px;letter-spacing:.14em;text-decoration:none;color:var(--black-ink)}
.f-nav a:hover{color:#B9AEFF}
.f-bot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--black-line);padding-top:20px;font-size:12px}
.pagetop{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--bg);border:0;cursor:pointer;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;z-index:15}
.pagetop.show{opacity:1;visibility:visible}
.pagetop svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4}
.notice{background:var(--accent-soft);font-size:13px;padding-block:8px}

/* player dialog */
dialog{border:0;padding:0;background:var(--bg);color:var(--ink);width:min(820px,calc(100vw - 32px));height:min(680px,calc(100dvh - 48px));max-height:calc(100dvh - 48px);overflow:hidden}
dialog::backdrop{background:rgba(13,12,20,.7)}
.dlg{display:grid;grid-template-columns:260px minmax(0,1fr);height:100%}
.dlg .ph{aspect-ratio:auto;height:100%;min-height:260px}
@media (max-width:640px){dialog{height:calc(100dvh - 32px);max-height:calc(100dvh - 32px)}.dlg{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.dlg .ph{aspect-ratio:auto;height:130px;min-height:0}.dlg .ph .ini{font-size:56px}.dlg-b{padding:20px}}

.dlg-b{padding:28px;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0;position:relative}
.dlg .x{position:absolute;right:10px;top:8px;background:none;border:0;font-size:26px;cursor:pointer;color:var(--muted);padding:4px 10px;line-height:1}
.dlg-k{font-family:var(--f-sub);font-size:12px;letter-spacing:.24em;color:var(--accent)}
.dlg-n{font-size:26px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.dlg-h{font-family:var(--f-sub);color:var(--muted);text-decoration:none;letter-spacing:.04em}
.dlg-h:hover{color:var(--accent)}
.comment{white-space:pre-wrap;margin:0;font-size:14px}
.tally{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.tally div{padding:10px 0;display:flex;flex-direction:column;align-items:center}
.tally b{font-family:var(--f-en);font-weight:400;font-size:30px;line-height:1.1}
.tally span{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.tally span i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.hist-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-top:6px}.hist-h b{font-family:var(--f-sub);letter-spacing:.14em;font-size:13px}.hist-h span{font-size:12px;color:var(--muted)}
.hist{display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin-right:-8px;padding-right:8px}
.hist div{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center;font-size:14px}
.hist .d{font-family:var(--f-sub);font-size:12px;color:var(--muted)}
.hist .t{overflow-wrap:anywhere}
.hist .n{grid-column:2/-1;font-size:12px;color:var(--muted);margin-top:-6px}
.none{color:var(--muted);font-size:13px;margin:0}

/* ---------- editor ---------- */
.ed{background:var(--soft);border-bottom:1px solid var(--line)}
.ed .wrap{padding-block:18px 22px;display:flex;flex-direction:column;gap:16px}
.ed-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ed-bar h2{font-size:17px;font-family:var(--f-body)}
.status{font-size:13px;color:var(--muted)}
.status.warn{color:var(--warn);font-weight:700}.status.ok{color:var(--ok);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.ed details{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.ed details>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:baseline}
.ed details>summary::-webkit-details-marker{display:none}
.ed details>summary::before{content:"▸";color:var(--muted)}
.ed details[open]>summary::before{content:"▾"}
.ed details>summary span{font-weight:400;font-size:12px;color:var(--muted)}
.ed .pane{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld textarea,.fld select,.mrow input:not([type=checkbox]):not([type=file]),.mrow select,.xrow input,.xrow select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.6}
.mrow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mrow.hide{opacity:.6}
.mrow-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mrow-h .av{width:40px;height:40px;font-size:16px;cursor:pointer;position:relative}
.mrow-h .nm{min-width:0;flex:1 1 140px}
.mrow-h .nm b{display:block;overflow-wrap:anywhere}
.mrow-h .nm span{font-size:12px;color:var(--muted)}

let members={},cfg=null,published=null,saveTimer=null,crSeasons=[];// crSeasons: [{id,name,created,current,players:[...]}] from the CR score sheet
const blankCfg=()=>({tagline:"",intro:"",xurl:"",mv:"",news:[],rules:[],list:[],crAuto:{rank:100,rate:2200,cur:false}});
const CLS=[["elf","エルフ"],["royal","ロイヤル"],["witch","ウィッチ"],["dragon","ドラゴン"],["nightmare","ナイトメア"],["bishop","ビショップ"],["nemesis","ネメシス"]];
const newId=()=>"p"+Date.now().toString(36)+rnd(4);
// HP members are their own list (adding/removing here does not touch the CR score roster).
// Older configs kept per-roster-member settings; turn those into the list once.
function migrate(){
  if(Array.isArray(cfg.list))return;
  const roster=Object.entries(members).sort((a,b)=>(a[1].order||0)-(b[1].order||0));const pos=new Map((cfg.order||[]).map((id,i)=>[id,i]));
  const ordered=roster.map((x,i)=>[x,pos.has(x[0])?pos.get(x[0]):1e6+i]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  cfg.list=ordered.map(([mid,m])=>{const c=(cfg.members||{})[mid]||{};const o={id:mid,mid,name:m.name||"",handle:m.handle||"",show:c.show!==false,role:c.role||"",comment:c.comment||"",extra:c.extra||[]};if(c.icon)o.icon=c.icon;return o});
  delete cfg.members;delete cfg.order;
}
/* ---------- CR score sheet → achievements ---------- */
const CLSN=Object.fromEntries(CLS);
const crOpt=()=>Object.assign({rank:100,rate:2200,cur:false},cfg.crAuto||{});
const numv=v=>{const n=parseFloat(String(v??"").replace(/[^0-9.]/g,""));return isFinite(n)&&n>0?n:null};
function crRows(c){// this member's rows in every season of the CR sheet: by roster link when both have one, otherwise by name
  const link=c.mid||(members[c.id]?c.id:null);const out=[];
  for(const s of crSeasons)for(const p of s.players){const nm=p.member&&members[p.member]?members[p.member].name:p.name;
    const ok=link&&p.member?p.member===link:!!norm(nm)&&norm(nm)===norm(c.name);if(ok)out.push({s,p})}
  return out}
function crAutoEntries(c){
  const o=crOpt();const ev=[];
  for(const {s,p} of crRows(c)){if(s.current&&!o.cur)continue;
    for(const [k,n] of CLS){const e=(p.e||{})[k];if(!e)continue;const rk=numv(e.rank),rt=numv(e.rate);
      if(!((rk&&o.rank&&rk<=o.rank)||(rt&&o.rate&&rt>=o.rate)))continue;
      const word=s.current?"":"最終";const res=rk?`${n} ${word}${rk}位`:`${n} ${word}CR${Math.round(rt)}`;
      ev.push({t:`${s.name} ランクマッチ`,at:s.created||0,res:s.current?res+"（暫定）":res,auto:1})}}
  return ev}
function crBest(c){let best=null;for(const {p} of crRows(c))for(const [k] of CLS){const rt=numv(((p.e||{})[k]||{}).rate);if(rt&&(!best||rt>best.cr))best={cr:Math.round(rt),crc:k}}return best}
async function loadCrSheet(){
  try{const meta=await F.getDoc(F.doc(db,ROOT));const d=meta.exists()?meta.data():{};const ss=Array.isArray(d.seasons)?d.seasons:[];
    crSeasons=await Promise.all(ss.map(async x=>{const ps=[];try{const q=await F.getDocs(F.collection(db,`${ROOT}/seasons/${x.id}/players`));q.forEach(y=>ps.push(y.data()))}catch(e){console.warn(e)}return{id:x.id,name:x.name||"",created:x.created||0,current:x.id===d.current,players:ps}}))}
  catch(e){console.warn(e);crSeasons=[]}
}
function moveMember(i,d){const j=i+d;if(j<0||j>=cfg.list.length)return;const L=cfg.list;[L[i],L[j]]=[L[j],L[i]];queueSave();renderMemberEd();const b=$(`mv${d<0?"u":"d"}_${L[j].id}`);if(b&&!b.disabled)b.focus()}
// manual results are free text (e.g. 優勝 / ベスト8 / ウィッチ 最終12位); older entries had a place + memo
const extraRes=x=>(x.res!=null?x.res:[x.place&&x.place!=="other"?PLACE[x.place]:"",x.note||""].filter(Boolean).join(" ")).trim();
function buildSite(){
  const out={tagline:cfg.tagline||"",intro:cfg.intro||"",xurl:cfg.xurl||"",mvk:cfg.mv?hkey(cfg.mv):"",news:(cfg.news||[]).filter(n=>(n.t||"").trim()).map(n=>({date:n.date||"",cat:n.cat||"info",t:n.t.trim(),body:(n.body||"").trim()})),rules:(cfg.rules||[]).filter(r=>(r.title||"").trim()||(r.body||"").trim()).map(r=>({title:(r.title||"").trim(),body:(r.body||"").trim()})),members:[]};
  for(const c of cfg.list||[]){if(c.show===false||!(c.name||"").trim())continue;
    const ev=[];for(const x of c.extra||[])if((x.t||"").trim()){const r=extraRes(x);ev.push(Object.assign({t:x.t.trim(),at:x.date?Date.parse(x.date):0},r?{res:r}:{}))}
    if(!c.crOff)for(const a of crAutoEntries(c))if(!ev.some(e=>e.t===a.t&&e.res===a.res))ev.push({t:a.t,at:a.at,res:a.res});
    ev.sort((a,b)=>(b.at||0)-(a.at||0));
    const o={name:c.name.trim(),handle:(c.handle||"").trim().replace(/^@+/,""),ev};if((c.role||"").trim())o.role=c.role.trim();if((c.comment||"").trim())o.comment=c.comment.trim();if(c.icon)o.ph=hkey(c.icon);
    const cr=parseInt(c.cr,10);if(cr>0){o.cr=cr;if(c.crc)o.crc=c.crc}else if(!c.crOff){const b=crBest(c);if(b){o.cr=b.cr;o.crc=b.crc}}
    out.members.push(o)}
  return out;
}
const sig=s=>stable(Object.assign({},s,{at:0,n:0}));
const savedImg={};// id -> key already stored under ROOT/site/ph_<id>
function cfgForSave(){const out=JSON.parse(JSON.stringify(cfg));const imgs=[];
  for(const c of out.list||[]){if(c.icon){const k=hkey(c.icon);if(savedImg[c.id]!==k)imgs.push([c.id,k,c.icon]);c.ik=k}else delete c.ik;delete c.icon}
  if(out.mv){const k=hkey(out.mv);if(savedImg.mv!==k)imgs.push(["mv",k,out.mv]);out.mvk=k}else delete out.mvk;delete out.mv;
  return{out,imgs}}
function queueSave(){clearTimeout(saveTimer);setStatus("保存中…");saveTimer=setTimeout(async()=>{try{const {out,imgs}=cfgForSave();
    for(const [id,k,d] of imgs){await F.setDoc(F.doc(db,`${ROOT}/site/ph_${id}`),{d,k});savedImg[id]=k}
    await F.setDoc(F.doc(db,`${ROOT}/site/config`),out);setStatus()}catch(e){console.warn(e);setStatus("保存できませんでした。通信を確認してください","warn")}},700);refresh()}
let statusMsg=null;
function setStatus(t,c){statusMsg=t?{t,c}:null;paintStatus()}
function paintStatus(){const s=$("edStatus");if(!s)return;const dirty=!published||sig(buildSite())!==sig(published);
  if(statusMsg){s.textContent=statusMsg.t;s.className="status "+(statusMsg.c||"")}
  else if(dirty){s.textContent=published?"公開中の内容と違いがあります。「ホームページに公開」で反映されます":"まだ公開されていません";s.className="status warn"}
  else{s.textContent=`公開中の内容と同じです（${new Date(published.at).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})} 公開）`;s.className="status ok"}
  const b=$("pubBtn");if(b)b.disabled=!dirty}
function refresh(){for(const c of cfg.list||[])if(c.icon)PH[hkey(c.icon)]=c.icon;if(cfg.mv)PH[hkey(cfg.mv)]=cfg.mv;render(Object.assign(buildSite(),{at:Date.now()}));paintStatus()}

async function publish(){
  const b=$("pubBtn");b.disabled=true;setStatus("公開しています…");
  const site=Object.assign(buildSite(),{at:Date.now(),n:rnd(24)});
  if(new Blob([JSON.stringify(site)]).size>900000){setStatus("文章が多すぎて公開できません。お知らせや実績を少し減らしてください","warn");b.disabled=false;return}
  // photos go in their own documents; only ones not already published are sent
  const had=new Set([...((published&&published.members)||[]).map(m=>m.ph),published&&published.mvk].filter(Boolean));
  const imgs=new Map();for(const c of cfg.list||[])if(c.icon&&c.show!==false)imgs.set(hkey(c.icon),c.icon);if(cfg.mv)imgs.set(hkey(cfg.mv),cfg.mv);
  const send=[...imgs].filter(([k])=>!had.has(k));
  try{
    // a batch request is capped at about 10MB, so photos are sent in groups (each group has its own gate)
    const groups=[];let cur=[],size=0;for(const x of send){if(cur.length&&(size+x[1].length>6e6||cur.length>=200)){groups.push(cur);cur=[];size=0}cur.push(x);size+=x[1].length}if(cur.length)groups.push(cur);
    for(const g of groups){const n=rnd(24);const w=F.writeBatch(db);w.set(F.doc(db,"sitegate",n),{k:BOARD,at:Date.now()});for(const [k,d] of g)w.set(F.doc(db,"site",SITE_ID,"ph",k),{d,n});await w.commit()}
    const w=F.writeBatch(db);w.set(F.doc(db,"sitegate",site.n),{k:BOARD,at:site.at});w.set(F.doc(db,"site",SITE_ID),site);await w.commit();published=site;setStatus("公開しました","ok");setTimeout(()=>{if(statusMsg&&statusMsg.t==="公開しました")setStatus()},4000)}
  catch(e){console.warn(e);setStatus("公開できませんでした。Firestore のルールが最新か確認してください","warn");b.disabled=false}
}

function resizeIcon(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=320;const c=document.createElement("canvas");c.width=c.height=s;const g=c.getContext("2d");const m=Math.min(img.width,img.height);g.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);res(c.toDataURL("image/jpeg",.8))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function resizeWide(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const W=Math.min(1600,img.width);const H=Math.round(img.height*W/img.width);const c=document.createElement("canvas");c.width=W;c.height=H;c.getContext("2d").drawImage(img,0,0,W,H);let q=.78,u=c.toDataURL("image/jpeg",q);while(u.length>260000&&q>.4){q-=.08;u=c.toDataURL("image/jpeg",q)}res(u)};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

      const crf=el("div","fld");crf.append(el("label",null,"最高CR（任意）"));const crr=el("div");crr.style.cssText="display:flex;gap:6px;flex-wrap:wrap";

      crr.append(cs,ci,el("span","hint","空欄ならCR管理表の最高値を自動で表示します"));crr.style.alignItems="center";crf.append(crr);row.append(crf);
      // automatic entries from the CR sheet
      {const auto=crAutoEntries(c);const box=el("div");box.style.cssText="display:flex;flex-direction:column;gap:4px";
        const h=el("div");h.style.cssText="display:flex;gap:10px;align-items:center;flex-wrap:wrap";h.append(el("span","sub",`CR管理表からの自動記録（${c.crOff?"オフ":auto.length+"件"}）`));
        const tg2=el("label","tog");const cb2=el("input");cb2.type="checkbox";cb2.id=`crOn_${c.id}`;cb2.checked=!c.crOff;cb2.onchange=()=>{c.crOff=!cb2.checked;queueSave();renderMemberEd()};tg2.append(cb2,document.createTextNode("載せる"));h.append(tg2);box.append(h);
        if(!c.crOff){if(!crRows(c).length)box.append(el("p","hint","CR管理表にこの人の行が見つかりません（名簿から追加した人か、名前が同じ人と結び付けます）"));
          else if(!auto.length)box.append(el("p","hint","条件に合う記録はまだありません"));
          else{const ul=el("div");ul.style.cssText="display:flex;flex-direction:column;font-size:13px;border-left:3px solid var(--line);padding-left:10px";for(const a of auto)ul.append(el("span",null,`${fmtD(a.at)}　${a.t}　${a.res}`));box.append(ul)}}
        row.append(box)}
      // results
      row.append(el("div","sub","実績（大会・リーグ・ランクマッチなど）"));row.append(el("p","hint","結果をクラス名から書くと（例：ウィッチ 最終12位）、公開ページでクラスの色のラベルが付きます。"));
      c.extra=c.extra||[];
      c.extra.forEach((x,j)=>{const r=el("div","xrow");
        const d=el("input");d.type="date";d.value=x.date||"";d.setAttribute("aria-label","日付");d.onchange=()=>{x.date=d.value;queueSave()};

        const p=el("input");p.value=extraRes(x);p.placeholder="結果（例：優勝 / ベスト8 / ウィッチ 最終12位）";p.setAttribute("aria-label","結果");p.setAttribute("list","dlRes");p.addEventListener("focus",refreshLists);p.oninput=()=>{x.res=p.value.slice(0,40);delete x.place;delete x.note;queueSave()};

      const addRow=el("div");addRow.style.cssText="display:flex;gap:8px;flex-wrap:wrap;align-items:center";
      const add=el("button","btn small","＋ 実績を追加");add.type="button";add.onclick=()=>{c.extra.push({date:"",t:"",res:""});renderMemberEd();queueSave()};addRow.append(add);
      {let opts=[];const sel=el("select");sel.id=`past_${c.id}`;sel.setAttribute("aria-label","記録済みの大会から追加");sel.style.cssText="border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:12px;width:auto;max-width:100%";
        // options are rebuilt whenever the list is opened, so entries typed a moment ago for other members show up

          sel.replaceChildren();const z=el("option",null,opts.length?"＋ 記録済みの大会から追加":"（記録済みの大会はまだありません）");z.value="";sel.append(z);

  const have=new Set(L.map(c=>norm(c.name)));const pool=Object.values(members).filter(m=>m.name&&!have.has(norm(m.name))).sort((a,b)=>(a.order||0)-(b.order||0));
  if(pool.length){const sel=el("select");sel.id="fromRoster";sel.setAttribute("aria-label","CRスコア表の名簿から追加");sel.style.cssText="border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;width:auto;max-width:100%";
    const z=el("option",null,"＋ CRスコア表の名簿から追加");z.value="";sel.append(z);pool.forEach((m,k)=>{const o=el("option",null,m.name+(m.handle?`（@${m.handle}）`:""));o.value=String(k);sel.append(o)});
    sel.onchange=()=>{if(sel.value==="")return;const m=pool[+sel.value];L.push({id:newId(),mid:Object.keys(members).find(k=>members[k]===m),name:m.name,handle:m.handle||"",show:true,role:"",comment:"",extra:[]});queueSave();renderMemberEd()};ar.append(sel)}
  P.append(ar);
}
function renderNewsEd(){
  const P=$("newsEd");P.replaceChildren();cfg.news=cfg.news||[];
  cfg.news.forEach((n,i)=>{const row=el("div","rrow");const h=el("div","rrow-h");
    const d=el("input");d.type="date";d.value=n.date||"";d.setAttribute("aria-label","日付");d.style.flex="0 0 150px";d.onchange=()=>{n.date=d.value;queueSave()};
    const c=el("select");c.setAttribute("aria-label","種類");for(const [k,l] of [["info","INFO（お知らせ）"],["event","EVENT（大会・イベント）"],["result","RESULT（結果）"],["member","MEMBER（メンバー）"]]){const o=el("option",null,l);o.value=k;if((n.cat||"info")===k)o.selected=true;c.append(o)}
    c.style.cssText="border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--surface)";c.onchange=()=>{n.cat=c.value;queueSave()};
    const del=el("button","btn small danger","削除");del.type="button";del.onclick=()=>{if(!del.dataset.arm){del.dataset.arm="1";del.textContent="本当に削除";setTimeout(()=>{if(del.isConnected){delete del.dataset.arm;del.textContent="削除"}},3000);return}cfg.news.splice(i,1);queueSave();renderNewsEd()};
    h.append(d,c,del);const t=el("input");t.id=`nt_${i}`;t.value=n.t||"";t.placeholder="タイトル";t.setAttribute("aria-label","タイトル");t.style.cssText="border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface)";t.oninput=()=>{n.t=t.value.slice(0,80);queueSave()};
    row.append(h,t,area(`nb_${i}`,n.body,v=>{n.body=v.slice(0,2000);queueSave()},"本文（なくてもOK。あるとタイトルを押して開けます）",3));P.append(row)});
  const add=el("button","btn","＋ お知らせを追加");add.type="button";add.style.alignSelf="flex-start";
  add.onclick=()=>{const d=new Date();cfg.news.unshift({date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`,cat:"info",t:"",body:""});renderNewsEd();queueSave();const t=$("nt_0");if(t)t.focus()};

function renderRuleEd(){
  const P=$("ruleEd");P.replaceChildren();cfg.rules=cfg.rules||[];
  cfg.rules.forEach((r,i)=>{const row=el("div","rrow");const h=el("div","rrow-h");h.append(el("span","no",`${String(i+1).padStart(2,"0")}`));
    const t=el("input");t.id=`rt_${i}`;t.value=r.title||"";t.placeholder="見出し（例：活動方針）";t.setAttribute("aria-label",`${i+1}番目の見出し`);t.oninput=()=>{r.title=t.value.slice(0,60);queueSave()};h.append(t);
    const up=el("button","btn small","↑");up.type="button";up.setAttribute("aria-label","上へ");up.disabled=i===0;up.onclick=()=>{[cfg.rules[i-1],cfg.rules[i]]=[cfg.rules[i],cfg.rules[i-1]];queueSave();renderRuleEd()};
    const dn=el("button","btn small","↓");dn.type="button";dn.setAttribute("aria-label","下へ");dn.disabled=i===cfg.rules.length-1;dn.onclick=()=>{[cfg.rules[i+1],cfg.rules[i]]=[cfg.rules[i],cfg.rules[i+1]];queueSave();renderRuleEd()};
    const del=el("button","btn small danger","削除");del.type="button";del.onclick=()=>{if(!del.dataset.arm){del.dataset.arm="1";del.textContent="本当に削除";setTimeout(()=>{if(del.isConnected){delete del.dataset.arm;del.textContent="削除"}},3000);return}cfg.rules.splice(i,1);queueSave();renderRuleEd()};
    h.append(up,dn,del);row.append(h,area(`rb_${i}`,r.body,v=>{r.body=v.slice(0,3000);queueSave()},"1行に1項目（例：公式大会で好成績を収める）",4));P.append(row)});
  const add=el("button","btn","＋ 項目を追加");add.type="button";add.style.alignSelf="flex-start";add.onclick=()=>{cfg.rules.push({title:"",body:""});renderRuleEd();queueSave();const t=$(`rt_${cfg.rules.length-1}`);if(t)t.focus()};P.append(add);
  const tip=el("p","hint","まとめて貼り付けたいときは、下の欄に「■見出し」で始まる行ごとに区切って貼ると、自動で項目に分けます。");P.append(tip);
  const bulk=el("textarea");bulk.id="ruleBulk";bulk.rows=4;bulk.placeholder="■活動方針\n公式大会で好成績を収める\n毎シーズンのランクマッチでCR上位を目指す\n■求める人材\n…";
  const go=el("button","btn small","貼り付けた内容を項目に追加");go.type="button";go.style.alignSelf="flex-start";
  go.onclick=()=>{const parts=bulk.value.split(/^[■◆●]\s*/m).map(s=>s.trim()).filter(Boolean);if(!parts.length)return;for(const p of parts){const [t,...b]=p.split("\n");cfg.rules.push({title:t.trim().slice(0,60),body:b.join("\n").trim().slice(0,3000)})}bulk.value="";queueSave();renderRuleEd()};
  P.append(bulk,go);

async function loadEditor(){
  if(!(await fb())){notice("編集画面を開けませんでした（通信を確認してください）");render(SAMPLE);return}
  try{
    const [mS,cS,pS]=await Promise.all([F.getDocs(F.collection(db,`${ROOT}/members`)),F.getDoc(F.doc(db,`${ROOT}/site/config`)),F.getDoc(F.doc(db,"site",SITE_ID))]);
    members={};mS.forEach(d=>members[d.id]=d.data());
    const raw=cS.exists()?cS.data():null;cfg=Object.assign(blankCfg(),raw||{});if(!raw||!Array.isArray(raw.list))delete cfg.list;migrate();published=pS.exists()?pS.data():null;await loadCrSheet();
    // images live in their own docs (older configs kept them inline: those are moved out on the next save)
    let legacy=false;await Promise.all([...(cfg.list||[]).map(async c=>{if(c.icon){legacy=true;return}if(!c.ik)return;try{const d=await F.getDoc(F.doc(db,`${ROOT}/site/ph_${c.id}`));if(d.exists()&&d.data().d){c.icon=d.data().d;savedImg[c.id]=d.data().k||hkey(c.icon)}}catch(e){console.warn(e)}}),
      (async()=>{if(cfg.mv){legacy=true;return}if(!cfg.mvk)return;try{const d=await F.getDoc(F.doc(db,`${ROOT}/site/ph_mv`));if(d.exists()&&d.data().d){cfg.mv=d.data().d;savedImg.mv=d.data().k||hkey(cfg.mv)}}catch(e){console.warn(e)}})()]);
    delete cfg.mvk;for(const c of cfg.list||[])delete c.ik;
    buildEditor();refresh();if(legacy)queueSave();
  }catch(e){console.warn(e);notice("編集データを読み込めませんでした。URLが正しいか、Firestore のルールが最新か確認してください");render(SAMPLE)}
}

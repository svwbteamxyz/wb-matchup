<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大会成績管理表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Serif+JP:wght@700;900&family=Noto+Sans+JP:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>


/* Layout: overall pass-rate tiles, tournament list, the selected tournament (stages + player table), then the report image and X post. */
:root{
  --bg:#EEF0F5; --panel:#FFFFFF; --ink:#171A26; --muted:#5C6178; --line:#D4D7E3; --soft:#E5E8F0;
  --accent:#4B3BC4; --accent-ink:#FFFFFF; --accent-soft:#E4E0FA; --danger:#B83A3A; --gold:#A9771A;
  --c-elf:#5DAA4E; --c-royal:#D9AE1E; --c-witch:#4A6FD6; --c-dragon:#C9741F; --c-nightmare:#B4232F; --c-bishop:#B9BEC9; --c-nemesis:#2EA3B8;
  --c-ink:#FFFFFF;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131B; --panel:#1A1D29; --ink:#E7E9F2; --muted:#9A9FB7; --line:#2D3145; --soft:#232738;
  --accent:#9A88FF; --accent-ink:#141220; --accent-soft:#2A2550; --danger:#F07A80; --gold:#E3B456; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131B; --panel:#1A1D29; --ink:#E7E9F2; --muted:#9A9FB7; --line:#2D3145; --soft:#232738;
  --accent:#9A88FF; --accent-ink:#141220; --accent-soft:#2A2550; --danger:#F07A80; --gold:#E3B456; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
h1{font-family:var(--f-display);font-weight:400;font-size:1.8rem;line-height:1.15;margin:0;letter-spacing:.02em}
.sub{margin:4px 0 0;color:var(--muted);font-size:.85rem}
h2{font-family:var(--f-display);font-weight:400;font-size:1.05rem;margin:0;letter-spacing:.03em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.spacer{flex:1}
a{color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;font-weight:700;font-size:.85rem}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--danger)}
button.danger.armed{background:var(--danger);color:var(--panel);border-color:var(--danger)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 6px;min-width:0}
input.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.banner{font-size:.85rem;padding:8px 12px;border-radius:8px;background:var(--accent-soft)}
.banner:empty{display:none}
.status{font-size:.78rem;color:var(--muted)}
.formula{font-size:.82rem;color:var(--muted)}
.formula b{color:var(--ink);font-weight:700}

/* class strip */
.classes{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:980px){.classes{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:560px){.classes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cls{border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.cls .nm{padding:5px 8px;font-weight:700;font-size:.85rem;color:var(--c-ink);text-align:center;letter-spacing:.08em}
.cls label{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:6px;padding:5px 8px;font-size:.72rem;color:var(--muted);font-weight:700}
.cls input{width:100%}
.bg-elf{background:var(--c-elf)}.bg-royal{background:var(--c-royal)}.bg-witch{background:var(--c-witch)}.bg-dragon{background:var(--c-dragon)}.bg-nightmare{background:var(--c-nightmare)}.bg-bishop{background:var(--c-bishop);color:#2A2E3D!important}.bg-nemesis{background:var(--c-nemesis)}

/* table */
.tbox{overflow:auto;max-height:80vh;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table.sc{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:.85rem}
.sc th,.sc td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
.sc thead th{position:sticky;background:var(--panel);z-index:2;font-weight:700;font-size:.75rem;padding:5px 4px;white-space:nowrap}
.sc thead tr:first-child th{top:0;height:30px}
.sc thead tr:nth-child(2) th{top:30px;color:var(--muted)}
.sc thead th.cl{color:var(--c-ink);font-size:.82rem;letter-spacing:.08em}
.sc .stick{position:sticky;left:0;z-index:1;background:var(--panel)}
.sc thead .stick{z-index:3}
.sc td.name{min-width:150px}
.sc td.name input{width:100%;border:0;background:transparent;font-weight:700;padding:7px 8px 2px}
.sc td.name input.h{font-weight:500;font-size:.78rem;color:var(--muted);padding:0 8px 6px}
.imgbox{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#FFFFFF}
.imgbox img{display:block;width:100%;height:auto}
.sc td.rk input{width:52px;border:0;background:transparent;padding:8px 6px}
.sc td.rt input{width:76px;border:0;background:transparent;padding:8px 6px}
.sc td.s{min-width:64px;text-align:right;padding:0 8px;font-family:var(--f-num);font-size:.82rem;color:var(--muted)}
.sc td.s.on{color:var(--ink);font-weight:700}
.sc td.rank{text-align:center;font-family:var(--f-num);font-weight:700;min-width:56px}
.sc td.tot{text-align:right;padding:0 10px;font-family:var(--f-num);font-weight:700;min-width:80px}
.sc tr.top1 td.rank{color:var(--gold)}
.sc td.del{padding:0 4px}
.sc td.del button{padding:4px 8px;font-size:.75rem}
.sc input:focus{background:var(--accent-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.io{width:100%;min-height:80px;font-family:var(--f-num);font-size:.78rem;font:inherit}

/* post */
.check{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);font-weight:700}
.inline{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:.72rem;font-weight:700;color:var(--muted)}
.fld input{padding:7px 8px}
.fld.grow{flex:1 1 220px}
.tlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.trow{display:grid;grid-template-columns:104px minmax(0,1fr) minmax(0,150px) 150px 28px;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;border-radius:0;border-left:0;border-right:0;border-bottom:0;font-weight:400;font-size:.9rem;width:100%}
.trow:first-child{border-top:0}
.trow:hover{background:var(--soft)}
.trow.on{background:var(--accent-soft)}
.trow .d{font-family:var(--f-num);font-size:.82rem;color:var(--muted)}
.trow .t{font-weight:700;overflow-wrap:anywhere}
.trow .ln{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.trow .rt{font-family:var(--f-num);font-size:.82rem;text-align:right}
.trow .rt b{color:var(--ink)}
.trow .go{color:var(--muted);text-align:right}
@media (max-width:700px){.trow{grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}.trow .d{grid-column:1}.trow .rt{grid-column:2;grid-row:1}.trow .t{grid-column:1/-1}.trow .ln{grid-column:1}.trow .go{display:none}}
.meter{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.meter .bar{flex:1 1 160px;height:10px;border-radius:999px;background:var(--soft);overflow:hidden;min-width:120px}
.meter .bar i{display:block;height:100%;background:var(--accent)}
.meter b{font-family:var(--f-num);font-size:1.4rem}
.big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.big b{font-family:var(--f-num);font-size:1.6rem;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.stat .k{font-size:.75rem;font-weight:700;color:var(--muted)}
table.pt{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem;min-width:640px}
.pt th{text-align:left;font-size:.72rem;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.pt td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:middle}
.pt td.name{min-width:150px}
.pt td.name input{width:100%;border:0;background:transparent;font-weight:700;padding:6px 6px 0}
.pt td.name input.h{font-weight:500;font-size:.78rem;color:var(--muted);padding:0 6px 4px}
.pt td.name .linked{padding:6px;display:flex;flex-direction:column;line-height:1.3}
.pt td.name .linked span{font-size:.78rem;color:var(--muted)}
.pt td.wl input{width:56px}
.pt td.res input{width:100%;min-width:140px}
.pt select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
.pass{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.82rem;white-space:nowrap}
.pass.yes{color:var(--accent)}.pass.no{color:var(--muted)}
.pt tr.yes td{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.addrow select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0;max-width:100%}
.tbx{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.hint{font-size:.78rem;color:var(--muted);margin:0}
.stg{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.srow .no{font-family:var(--f-num);font-size:.78rem;color:var(--muted);align-self:center;width:4.5em}
.meters{display:flex;flex-direction:column;gap:8px}
.pt th.grp{text-align:center;border-left:1px solid var(--line);color:var(--ink)}
.pt td.sx{border-left:1px solid var(--line)}
.pt td.off{color:var(--muted);text-align:center;font-size:.8rem}
textarea.post{width:100%;font:inherit;font-size:.92rem;line-height:1.6;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
.btnlink{display:inline-flex;align-items:center;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;font-weight:700;font-size:.85rem;text-decoration:none}
.over{color:var(--danger);font-weight:700}
.fld select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-width:0;max-width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>大会成績管理表</h1>
      <p class="sub">大会ごとに突破ライン（Day2進出・プレーオフ進出など）と出場メンバーの戦績を記録します。</p>
    </div>
    <div class="row">
      <a id="toMatchup" href="./" hidden>相性表へ</a>
      <a id="toScore" href="score.html" hidden>CRスコア表へ</a>
      <button type="button" id="copyLink" class="primary" hidden>共有リンクをコピー</button>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <section class="panel">
    <div class="row"><h2>通算</h2><span class="spacer"></span><span class="status" id="syncStatus"></span></div>
    <div class="stats" id="statsHost"></div>
  </section>

  <section class="panel">
    <div class="row"><h2>大会</h2><span class="spacer"></span><button type="button" class="primary" id="newBtn">新しい大会を追加</button></div>
    <div class="inline" id="newForm" hidden>
      <div class="fld"><label for="nDate">開催日</label><input type="date" id="nDate"></div>
      <div class="fld grow"><label for="nName">大会名</label><input type="text" id="nName" maxlength="60" placeholder="例：RAGE Shadowverse 2026 Winter"></div>
      <div class="fld"><label for="nLine">突破ライン</label><input type="text" id="nLine" maxlength="20" list="lineList" placeholder="例：Day2進出"></div>
      <div class="fld"><label for="nW">突破に必要な勝ち数</label><input type="number" id="nW" min="0" max="30" class="num" placeholder="例：5" style="width:120px"></div>
      <label class="check"><input type="checkbox" id="nAll" checked> 名簿のメンバーを全員入れておく</label>
      <button type="button" class="primary" id="nCreate">追加</button>
      <button type="button" id="nCancel">やめる</button>
    </div>
    <datalist id="lineList"><option value="Day2進出"></option><option value="プレーオフ進出"></option><option value="決勝トーナメント進出"></option><option value="予選突破"></option></datalist>
    <div id="listHost"></div>
  </section>

  <section class="panel" id="detail" hidden>
    <div class="row"><h2 id="dTitle"></h2><span class="spacer"></span><button type="button" class="danger" id="dDel">この大会を削除</button></div>
    <div class="inline" style="border-style:solid">
      <div class="fld"><label for="dDate">開催日</label><input type="date" id="dDate"></div>
      <div class="fld grow"><label for="dName">大会名</label><input type="text" id="dName" maxlength="60"></div>
      <label class="check"><input type="checkbox" id="dHp"> ホームページの実績に載せる</label>
    </div>
    <div class="stg" id="stageEd"></div>
    <div class="meters" id="dMeter"></div>
    <div class="addrow">
      <select id="pick" aria-label="追加するメンバー"></select>
      <button type="button" class="primary" id="addPicked">追加</button>
      <button type="button" id="addAll">名簿の全員を追加</button>
      <button type="button" id="addFree">名簿にない人を追加</button>
    </div>
    <div class="tbx"><table class="pt"><thead id="pHead"></thead><tbody id="pBody"></tbody></table></div>
    <p class="hint">「突破」は勝ち数が必要な勝ち数以上なら自動で付きます。オポネント等で勝ち数どおりにならなかったときは「突破」「未突破」を選んでください。次のステージ（Day2 など）は、前のステージを突破した人だけ入力できます。最終成績（例：ベスト16、優勝）を入れると、ホームページにはそちらが載ります。</p>
  </section>

  <section class="panel" id="share" hidden>
    <div class="row"><h2>速報画像とXの投稿</h2><span class="spacer"></span><span class="status" id="imgStatus"></span></div>
    <div class="inline" style="border-style:solid">
      <div class="fld grow"><label for="kind">画像の種類</label><select id="kind"></select></div>
      <div class="fld grow"><label for="imgTags">画像に入れるハッシュタグ</label><input type="text" id="imgTags" maxlength="80" placeholder="#チームXYZ #シャドウバースWB"></div>
    </div>
    <label class="check"><input type="checkbox" id="incRate" checked> 通過率を画像と投稿に入れる（まとめのとき）</label>
    <div class="imgbox" id="imgBox"><img id="outImg" alt="速報画像"></div>
    <div class="row"><button type="button" class="primary" id="saveImg">画像を保存</button></div>
    <div class="fld"><label for="postTags">投稿のハッシュタグ（1行に1つ）</label><textarea id="postTags" class="post" rows="3" placeholder="#シャドバWB&#10;#シャドバチーム"></textarea></div>
    <div class="row"><b style="font-size:.85rem">投稿する文章</b><span class="spacer"></span><span class="status" id="postCount"></span></div>
    <textarea id="postText" class="post" rows="12" aria-label="投稿する文章"></textarea>
    <div class="row">
      <button type="button" class="primary" id="shareBtn" hidden>画像付きでXにシェア</button>
      <a class="btnlink" id="intentLink" href="https://x.com/intent/post" target="_blank" rel="noopener">Xの投稿画面を開く</a>
      <button type="button" id="copyPost">文章をコピー</button>
      <button type="button" id="resetPost" hidden>自動の文章に戻す</button>
    </div>
    <div class="status" id="postHelp"></div>
  </section>
</div>

<script type="module">
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA5Eerx9nMPguK-NLnX-nJylTzcn06Q_3A",
  authDomain: "teamxyz-2962e.firebaseapp.com",

};
const FB="https://www.gstatic.com/firebasejs/10.12.2/";

const $=id=>document.getElementById(id);
const CLASSES=[["elf","エルフ"],["royal","ロイヤル"],["witch","ウィッチ"],["dragon","ドラゴン"],["nightmare","ナイトメア"],["bishop","ビショップ"],["nemesis","ネメシス"]];
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
const num=v=>{if(v===""||v==null)return null;const n=Number(String(v).replace(/,/g,""));return Number.isFinite(n)?n:null};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const f2=v=>v==null?"":v.toFixed(2);

/* ---------- adapters ---------- */
function setSync(t){$("syncStatus").textContent=t}
const writers={};
function write(path,val){
  setSync("保存中…");
  const w=writers[path]||(writers[path]=(()=>{let busy=false,has=false,next;const go=async v=>{if(busy){has=true;next=v;return}busy=true;
    try{await (v?A.set(path,v):A.del(path));setSync("保存済み")}catch(e){console.error(e);setSync(e&&(e.code==="permission-denied"||e.code==="invalid_argument")?"保存が拒否されました。ルール設定を確認してください":"保存できませんでした。通信を確認してください")}
    busy=false;if(has){has=false;const n=next;next=undefined;go(n)}};return go})());
  w(val);
}
const stopped=e=>{console.error(e);setSync(e&&e.code==="permission-denied"?"読み込みが拒否されました。ルール設定を確認してください":"同期が止まりました。再読み込みしてください")};
function firebaseAdapter(fs,db){return{
  watchDoc:(p,cb)=>fs.onSnapshot(fs.doc(db,p),s=>cb(s.exists()?s.data():null),stopped),
  watchColl:(p,cb)=>fs.onSnapshot(fs.collection(db,p),qs=>{const m={};qs.docs.forEach(d=>m[d.id]=d.data());cb(m)},stopped),
  getDoc:async p=>{const s=await fs.getDoc(fs.doc(db,p));return s.exists()?s.data():null},
  getColl:async p=>{const qs=await fs.getDocs(fs.collection(db,p));const m={};qs.docs.forEach(d=>m[d.id]=d.data());return m},
  set:(p,v)=>fs.setDoc(fs.doc(db,p),v), del:p=>fs.deleteDoc(fs.doc(db,p))
}}
function claudeAdapter(db){return{
  watchDoc:(p,cb)=>db.doc(p).onSnapshot(s=>cb(s.exists?s.data():null),stopped),
  watchColl:(p,cb)=>db.collection(p).onSnapshot(qs=>{const m={};qs.docs.forEach(d=>m[d.id]=d.data());cb(m)},stopped),
  getDoc:async p=>{const s=await db.doc(p).get();return s.exists?s.data():null},
  getColl:async p=>{const qs=await db.collection(p).get();const m={};qs.docs.forEach(d=>m[d.id]=d.data());return m},
  set:(p,v)=>db.doc(p).set(v), del:p=>db.doc(p).delete()
}}
function localAdapter(){
  const K="cr-score-local-v2";let d={};try{d=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){}
  const subs=new Set();const save=()=>{try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}subs.forEach(f=>f())};
  const coll=p=>{const m={},pre=p+"/";for(const k in d){if(k.startsWith(pre)&&!k.slice(pre.length).includes("/"))m[k.slice(pre.length)]=d[k]}return m};
  const sub=f=>{subs.add(f);f();return()=>subs.delete(f)};
  return{
    watchDoc:(p,cb)=>sub(()=>cb(d[p]?JSON.parse(JSON.stringify(d[p])):null)),
    watchColl:(p,cb)=>sub(()=>cb(JSON.parse(JSON.stringify(coll(p))))),
    getDoc:async p=>d[p]||null,getColl:async p=>coll(p),
    set:async(p,v)=>{d[p]=v;save()},del:async p=>{delete d[p];save()}
  };
}

const tPath=id=>`${ROOT}/tourneys/${id}`;

const sortedMembers=()=>Object.entries(members).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
const sortedT=()=>Object.entries(tourneys).sort((a,b)=>String(b[1].date||"").localeCompare(String(a[1].date||""))||(b[1].created||0)-(a[1].created||0));
const plist=T=>Object.entries(T.players||{}).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
const fmtD=s=>s?s.replace(/-/g,"."):"日付未設定";
const editingDetail=()=>{const a=document.activeElement;return ($("detail").contains(a)||$("share").contains(a))&&(a.tagName==="INPUT"||a.tagName==="SELECT"||a.tagName==="TEXTAREA")};

/* ---------- stages ----------
   A tournament has one or more stages (Day1 → Day2 → …). Stage 0 keeps its record in the player's w / l / pass,
   later stages in p.s[i]. Only players who passed the previous stage take part in the next one. */
const stagesOf=T=>Array.isArray(T.stages)&&T.stages.length?T.stages:[{label:"",line:T.line||"",lineW:T.lineW}];
const recOf=(p,i)=>i===0?{w:p.w,l:p.l,pass:p.pass}:(((p.s||{})[i])||{});
function passedAt(T,p,i){const r=recOf(p,i);if(r.pass==="yes")return true;if(r.pass==="no")return false;const need=num((stagesOf(T)[i]||{}).lineW),w=num(r.w);return need!=null&&need>0&&w!=null?w>=need:null}
const inStage=(T,p,i)=>i===0||passedAt(T,p,i-1)===true;
function rateAt(T,i){const ps=plist(T).map(x=>x[1]).filter(p=>inStage(T,p,i));const n=ps.length;const k=ps.filter(p=>passedAt(T,p,i)===true).length;return{n,k,pct:n?Math.round(k*1000/n)/10:null}}
function bestStage(T,p){let b=-1;const S=stagesOf(T);for(let i=0;i<S.length;i++){if(inStage(T,p,i)&&passedAt(T,p,i)===true)b=i;else break}return b}
const stageName=(T,i)=>{const s=stagesOf(T)[i]||{};return s.label||(stagesOf(T).length>1?`ステージ${i+1}`:"予選")};
const recText=r=>r.w!=null&&r.l!=null?`${r.w}-${r.l}`:r.w!=null?`${r.w}勝`:"";
function setStages(T,S){T.stages=S.map(s=>{const o={label:(s.label||"").slice(0,16),line:(s.line||"").slice(0,20)};const w=num(s.lineW);if(w!=null)o.lineW=Math.max(0,Math.min(30,Math.round(w)));return o});
  T.line=T.stages[0].line;if(T.stages[0].lineW!=null)T.lineW=T.stages[0].lineW;else delete T.lineW}

function renderStats(){
  const H=$("statsHost");H.replaceChildren();const all=sortedT().map(x=>x[1]);
  if(!all.length){H.append(el("div","status","大会を追加すると、突破ラインごとの通算の突破率がここに出ます。"));return}
  const by=new Map();
  for(const T of all)stagesOf(T).forEach((S,i)=>{const L=(S.line||"突破").trim()||"突破";const r=rateAt(T,i);if(!r.n)return;const g=by.get(L)||{n:0,k:0,last:null,lastName:""};g.n+=r.n;g.k+=r.k;if(!g.last){g.last=r;g.lastName=T.name}by.set(L,g)});
  if(!by.size){H.append(el("div","status","出場メンバーを入れると、通算の突破率がここに出ます。"));return}
  for(const [L,g] of by){const c=el("div","stat");c.append(el("span","k",`${L}率（通算）`));
    const b=el("div","big");b.append(el("b",null,`${Math.round(g.k*1000/g.n)/10}%`),el("span","status",`のべ${g.n}人中 ${g.k}人`));c.append(b);
    if(g.last)c.append(el("span","status",`前回（${g.lastName}）：${g.last.pct}%（${g.last.n}人中${g.last.k}人）`));H.append(c)}
}

function refreshRows(){
  const T=tourneys[viewId];if(!T)return;const S=stagesOf(T);
  for(const tr of $("pBody").querySelectorAll("tr[data-pid]")){const p=(T.players||{})[tr.dataset.pid];if(!p)continue;let any=false;
    tr.querySelectorAll("td.pc").forEach((td,i)=>{const ok=passedAt(T,p,i);const on=inStage(T,p,i);const b=td.querySelector(".pass");
      b.className="pass "+(ok?"yes":ok===false?"no":"");b.textContent=!on?"":ok?"✓ 突破":ok===false?"—":"？";if(on&&ok)any=true;
      td.querySelector("select").disabled=!on});
    tr.querySelectorAll("input[data-st]").forEach(inp=>{inp.disabled=!inStage(T,p,+inp.dataset.st)});
    tr.className=any?"yes":""}
  const M=$("dMeter");M.replaceChildren();
  S.forEach((s,i)=>{const r=rateAt(T,i);const row=el("div","meter");
    if(!r.n){row.append(el("span","status",i===0?"出場者を追加すると突破率が出ます。":`${stageName(T,i)}：前のステージを突破した人が入ります。`));M.append(row);return}
    const bar=el("span","bar");const b=el("i");b.style.width=(r.pct||0)+"%";bar.append(b);
    row.append(el("span","status",`${S.length>1?stageName(T,i)+" ":""}${s.line||"突破"}率`),el("b",null,`${r.pct}%`),el("span","status",`${r.n}人中 ${r.k}人`),bar);M.append(row)});
  renderStats();renderList();
}

const NAVY="#1F2A4D",GOLD="#BF8A2E",GRAY="#8B8E9E",INK="#16171D",RULE="#DADCE3",PILL="#F5E6C8",WHITE="#FFFFFF";
const SERIF=`"Noto Serif JP","Hiragino Mincho ProN",serif`,SANS=`"Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif`;
// English words for a line like "Day2進出" or "プレーオフ進出"
function lineEN(line){const t=String(line||"");const d=t.match(/day\s*(\d+)/i);if(d)return`DAY${d[1]}`;if(/プレーオフ|playoff/i.test(t))return"PLAYOFFS";if(/決勝|final/i.test(t))return"FINALS";if(/本戦|main/i.test(t))return"MAIN STAGE";return"NEXT STAGE"}
const eyebrowOf=line=>{const e=lineEN(line);return(e==="PLAYOFFS"?"PLAYOFF":e==="NEXT STAGE"?"STAGE":e)+" ADVANCEMENT"};
const labelEN=(T,i)=>{const s=stagesOf(T)[i]||{};return s.label?s.label.toUpperCase():(i===0?"予選":`STAGE${i+1}`)};
const nextEN=(T,i)=>{const n=stagesOf(T)[i+1];return n&&n.label?n.label.toUpperCase():lineEN((stagesOf(T)[i]||{}).line)};
function kinds(T){const out=[];const S=stagesOf(T);
  S.forEach((s,i)=>{const r=rateAt(T,i);out.push({v:"s"+i,label:`まとめ：${S.length>1?stageName(T,i)+" ":""}${s.line||"突破"}（${r.k}/${r.n}人）`})});
  // personal images only for players who reached the last stage's line (the playoffs)
  const last=S.length-1;const finalIsPlayoff=S.length>1||/プレーオフ|playoff/i.test(S[last].line||"");
  if(finalIsPlayoff)for(const [pid,p] of plist(T)){const b=bestStage(T,p);if(b===last)out.push({v:"p"+pid,label:`個人：${who(p).name||"（名前なし）"}　${S[b].line||"突破"}`})}
  return out}

function spaced(ctx,text,x,y,sp,align){const chars=[...text];const w=chars.reduce((a,c)=>a+ctx.measureText(c).width,0)+sp*(chars.length-1);let cx=align==="right"?x-w:align==="center"?x-w/2:x;
  const keep=ctx.textAlign;ctx.textAlign="left";for(const c of chars){ctx.fillText(c,cx,y);cx+=ctx.measureText(c).width+sp}ctx.textAlign=keep;return w}
function fit(ctx,text,font,size,maxW,weight){let s=size;do{ctx.font=`${weight} ${s}px ${font}`;if(ctx.measureText(text).width<=maxW)break;s-=2}while(s>12);return s}

}
function drawPersonal(ctx,W,T,pid){
  const p=(T.players||{})[pid];if(!p)return;const S=stagesOf(T);const b=bestStage(T,p);const s=S[Math.max(0,b)];const w=who(p);
  frame(ctx,W,T,`${s.line||"突破"}速報`,[labelEN(T,0)==="予選"?"予選":labelEN(T,0),nextEN(T,Math.max(0,b))]);

  ctx.fillStyle=INK;fit(ctx,t1,SANS,42,900,900);ctx.fillText(t1,275,866);ctx.fillStyle=GRAY;ctx.font=`700 25px ${SANS}`;if(w.handle)ctx.fillText("@"+w.handle,275,915);

async function drawImage(){
  const T=viewId&&tourneys[viewId];if(!T||$("share").hidden||!kind)return;

function autoPost(){
  const T=viewId&&tourneys[viewId];if(!T||!kind)return"";const S=stagesOf(T);const tags=(T.tags??"#シャドバWB\n#シャドバチーム").trim();
  if(kind.startsWith("s")){const i=+kind.slice(1);const s=S[i];const r=rateAt(T,i);const ps=plist(T).map(x=>x[1]).filter(p=>inStage(T,p,i)&&passedAt(T,p,i)===true);
    const L=["【大会結果報告】",`${T.name||""}${s.label?" "+s.label:""}`,`以下のメンバーが${s.line||"突破"}を果たしました。`,""];

  const p=(T.players||{})[kind.slice(1)];if(!p)return"";const b=bestStage(T,p);const line=(S[Math.max(0,b)]||{}).line||"突破";const w=who(p);

function xLength(t){let n=0;for(const ch of t){const c=ch.codePointAt(0);n+=(c<=0x10FF||(c>=0x2000&&c<=0x200D)||(c>=0x2010&&c<=0x201F)||(c>=0x2032&&c<=0x2037))?1:2}return n}
function updatePost(){const ta=$("postText");const auto=autoPost();if(document.activeElement===ta)return;if(!postDirty||ta.value===lastAuto){ta.value=auto;postDirty=false}lastAuto=auto;$("resetPost").hidden=!postDirty;postMeta()}

(async()=>{
  render();
